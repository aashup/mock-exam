name: exam-app

services:
  exam-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-api
    ports:
      # host:container — keep host port 8000 to match the mobile app
      # (10.0.2.2:8000) and the README.
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    # DB connection comes from .env — see the "Docker" section in .env.example
    # (DB_HOST=db, DB_DATABASE=exam_app, DB_USERNAME=root, DB_PASSWORD=secret).
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - exam-app
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:9.6
    container_name: exam-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: exam_app
      MYSQL_ROOT_PASSWORD: tiger
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptiger"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - exam-app

volumes:
  db_data:

networks:
  exam-app:
    driver: bridge
